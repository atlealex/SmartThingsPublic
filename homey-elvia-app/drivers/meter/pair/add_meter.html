<html>
<head>
  <style>
    body { padding: 16px; font-family: sans-serif; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; }
    .hint { font-size: 12px; color: #666; margin-top: 2px; }
    .error { color: #c0392b; margin-top: 12px; }
  </style>
</head>
<body>
  <label for="meteringPointId">Metering point ID (målepunkt-ID)</label>
  <input type="text" id="meteringPointId" required />

  <label for="subscriptionKey">Elvia API subscription key</label>
  <input type="password" id="subscriptionKey" required />
  <div class="hint">From elvia.portal.azure-api.net, "Grid tariff" product.</div>

  <label for="accessToken">Personal access token (optional, from elvid.no)</label>
  <input type="password" id="accessToken" />
  <div class="hint">Only needed if you also want hourly personal consumption data.</div>

  <div id="error" class="error"></div>

  <button type="button" id="submitButton" style="margin-top: 16px;">Add device</button>

  <script type="text/javascript">
    window.addEventListener('error', (event) => {
      const errorEl = document.getElementById('error');
      if (errorEl) errorEl.textContent = 'Script error: ' + event.message;
    });

    try {
      Homey.setTitle('Add Elvia metering point');

      const submitButton = document.getElementById('submitButton');

      submitButton.addEventListener('click', () => {
        const errorEl = document.getElementById('error');
        try {
          const meteringPointId = document.getElementById('meteringPointId').value.trim();
          const subscriptionKey = document.getElementById('subscriptionKey').value.trim();
          const accessToken = document.getElementById('accessToken').value.trim();
          errorEl.textContent = '';

          if (!meteringPointId || !subscriptionKey) {
            errorEl.textContent = 'Metering point ID and subscription key are required.';
            return;
          }

          if (!/^\d{18}$/.test(meteringPointId)) {
            errorEl.textContent = 'Metering point ID (GSRN) should be 18 digits, e.g. starting with 707. Yours has ' + meteringPointId.length + '.';
            return;
          }

          submitButton.disabled = true;
          submitButton.textContent = 'Adding...';

          const device = {
            name: `Elvia ${meteringPointId}`,
            data: { id: meteringPointId },
            settings: {
              meteringPointId,
              subscriptionKey,
              accessToken,
              pollIntervalMinutes: 30,
            },
          };

          Homey.createDevice(device)
            .then(() => Homey.done())
            .catch((err) => {
              submitButton.disabled = false;
              submitButton.textContent = 'Add device';
              errorEl.textContent = err.message || String(err);
            });
        } catch (err) {
          errorEl.textContent = 'Click handler error: ' + err.message;
        }
      });
    } catch (err) {
      const errorEl = document.getElementById('error');
      if (errorEl) errorEl.textContent = 'Init error: ' + err.message;
    }
  </script>
</body>
</html>
