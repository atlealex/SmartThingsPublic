<html>
<head>
  <style>
    body { padding: 16px; font-family: sans-serif; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; }
    .hint { font-size: 12px; color: #666; margin-top: 2px; }
    .error { color: #c0392b; margin-top: 12px; }
  </style>
</head>
<body>
  <label for="tibberToken">Tibber API token</label>
  <input type="password" id="tibberToken" required />
  <div class="hint">From developer.tibber.com.</div>

  <label for="elviaSubscriptionKey">Elvia API subscription key (optional, for grid rent)</label>
  <input type="password" id="elviaSubscriptionKey" />
  <div class="hint">Same key used in the Elvia-Nett app. Leave empty to skip grid rent.</div>

  <label for="elviaMeteringPointId">Metering point ID (målepunkt-ID)</label>
  <input type="text" id="elviaMeteringPointId" />

  <div id="error" class="error"></div>

  <button type="button" id="submitButton" style="margin-top: 16px;">Add device</button>

  <script type="text/javascript">
    Homey.setTitle('Add Strømkostnad device');

    document.getElementById('submitButton').addEventListener('click', () => {
      const tibberToken = document.getElementById('tibberToken').value.trim();
      const elviaSubscriptionKey = document.getElementById('elviaSubscriptionKey').value.trim();
      const elviaMeteringPointId = document.getElementById('elviaMeteringPointId').value.trim();
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      if (!tibberToken) {
        errorEl.textContent = 'Tibber API token is required.';
        return;
      }

      const device = {
        name: 'Strømkostnad',
        data: { id: `tibbercost-${Date.now()}` },
        settings: {
          tibberToken,
          useSpotPrice: true,
          fixedPrice: 0,
          markupOre: 0,
          monthlyFee: 0,
          elviaSubscriptionKey,
          elviaMeteringPointId,
        },
      };

      Homey.createDevice(device)
        .then(() => Homey.done())
        .catch((err) => {
          errorEl.textContent = err.message || String(err);
        });
    });
  </script>
</body>
</html>
