<html>
  <head>
    <style>
      html, body.homey-widget {
        height: 100%;
      }

      body.homey-widget {
        padding: 12px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }

      .donut-title {
        margin: 0 0 8px;
        font-weight: 600;
        flex: none;
      }

      .donut-chart-area {
        position: relative;
        flex: 1;
        min-height: 0;
      }

      .donut-chart-area svg {
        position: absolute;
        inset: 0;
        display: block;
      }

      .donut-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        pointer-events: none;
      }

      .donut-center-value {
        font-size: 22px;
        font-weight: 700;
        line-height: 1.1;
      }

      .donut-center-label {
        font-size: 11px;
        opacity: 0.7;
        margin-top: 2px;
      }

      .donut-center-detail-percentage {
        font-size: 17px;
        opacity: 0.85;
        margin-top: 2px;
      }

      .donut-segment {
        cursor: pointer;
      }

      .donut-empty {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        opacity: 0.6;
        font-size: 13px;
      }
    </style>
  </head>

  <body class="homey-widget homey-text-regular">
    <h2 class="donut-title" id="title"></h2>

    <div class="donut-chart-area" id="chartArea">
      <div class="donut-center" id="donutCenter">
        <div class="donut-center-value" id="centerValue">-</div>
        <div class="donut-center-label" id="centerLabel">kWh totalt</div>
      </div>
    </div>

    <script type="text/javascript">
      // A fixed, distinguishable categorical palette - cycles if there are
      // more devices than colors.
      const PALETTE = ['#2E86DE', '#10AC84', '#FF9F1C', '#8E44AD', '#EE5253', '#1ABC9C', '#576574', '#F368E0'];
      const MUTED_COLOR = '#6b6b70';
      const EXPLODE_OFFSET_RATIO = 0.06; // of minDim, how far the selected slice pops out
      const REFRESH_INTERVAL_MS = 60 * 1000;
      const LABEL_MIN_GAP_PX = 15;
      const SVG_NS = 'http://www.w3.org/2000/svg';

      // Render state: kept outside render() so a click can redraw with the
      // same data (no need to re-fetch just to toggle a selection).
      let currentItems = [];
      let currentTotal = 0;
      let selectedIndex = null;

      function formatKwh(value) {
        return value.toLocaleString('nb-NO', { maximumFractionDigits: 1, minimumFractionDigits: 1 });
      }

      // angleDeg: 0 = top (12 o'clock), increasing clockwise.
      function pointOnCircle(cx, cy, r, angleDeg) {
        const rad = (angleDeg * Math.PI) / 180;
        return { x: cx + r * Math.sin(rad), y: cy - r * Math.cos(rad) };
      }

      function donutSegmentPath(cx, cy, outerR, innerR, startDeg, endDeg) {
        const largeArc = endDeg - startDeg > 180 ? 1 : 0;
        const o0 = pointOnCircle(cx, cy, outerR, startDeg);
        const o1 = pointOnCircle(cx, cy, outerR, endDeg);
        const i1 = pointOnCircle(cx, cy, innerR, endDeg);
        const i0 = pointOnCircle(cx, cy, innerR, startDeg);
        return [
          `M ${o0.x} ${o0.y}`,
          `A ${outerR} ${outerR} 0 ${largeArc} 1 ${o1.x} ${o1.y}`,
          `L ${i1.x} ${i1.y}`,
          `A ${innerR} ${innerR} 0 ${largeArc} 0 ${i0.x} ${i0.y}`,
          'Z',
        ].join(' ');
      }

      function svgEl(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
        return el;
      }

      // Pushes overlapping labels on the same side apart vertically,
      // top-to-bottom, so closely-angled small segments don't collide.
      function resolveLabelCollisions(labels) {
        for (const side of [-1, 1]) {
          const group = labels.filter((l) => l.side === side).sort((a, b) => a.y - b.y);
          for (let i = 1; i < group.length; i++) {
            const minY = group[i - 1].y + LABEL_MIN_GAP_PX;
            if (group[i].y < minY) group[i].y = minY;
          }
        }
      }

      function updateCenter(innerR, minDim) {
        const centerValueEl = document.getElementById('centerValue');
        const centerLabelEl = document.getElementById('centerLabel');
        const donutCenter = document.getElementById('donutCenter');
        donutCenter.querySelectorAll('.donut-center-detail-percentage').forEach((el) => el.remove());

        // Keep center text within the ring's hole, and scale it with the
        // chart's actual size rather than a fixed px value.
        donutCenter.style.maxWidth = `${innerR * 2 * 0.88}px`;
        centerValueEl.style.fontSize = `${Math.max(16, Math.round(minDim * 0.09))}px`;

        if (selectedIndex === null || !currentItems[selectedIndex]) {
          centerValueEl.textContent = formatKwh(currentTotal);
          centerLabelEl.textContent = 'kWh totalt';
          centerLabelEl.style.display = '';
          return;
        }

        const item = currentItems[selectedIndex];
        const percentage = currentTotal > 0 ? Math.round((item.value / currentTotal) * 100) : 0;

        centerValueEl.textContent = `${formatKwh(item.value)} kWh`;
        centerLabelEl.style.display = 'none';

        const percentageEl = document.createElement('div');
        percentageEl.className = 'donut-center-detail-percentage';
        percentageEl.style.fontSize = `${Math.max(13, Math.round(minDim * 0.06))}px`;
        percentageEl.textContent = `${percentage} %`;

        donutCenter.appendChild(percentageEl);
      }

      function selectIndex(index) {
        selectedIndex = selectedIndex === index ? null : index;
        draw();
      }

      function draw() {
        const chartArea = document.getElementById('chartArea');
        chartArea.querySelectorAll('svg, .donut-empty').forEach((el) => el.remove());

        const w = chartArea.clientWidth;
        const h = chartArea.clientHeight;
        if (w === 0 || h === 0) return; // not laid out yet

        const cx = w / 2;
        const cy = h / 2;
        const minDim = Math.min(w, h);
        const outerR = minDim * 0.28;
        const innerR = outerR * 0.55;

        updateCenter(innerR, minDim);

        if (currentItems.length === 0 || currentTotal === 0) {
          const empty = document.createElement('div');
          empty.className = 'donut-empty';
          empty.textContent = 'Ingen data ennå';
          chartArea.appendChild(empty);
          return;
        }

        const lineBendR = outerR + minDim * 0.06;
        const lineOutExtra = minDim * 0.08;
        const explodeOffset = minDim * EXPLODE_OFFSET_RATIO;

        const svg = svgEl('svg', { width: w, height: h, viewBox: `0 0 ${w} ${h}` });

        let cursor = 0;
        const labels = currentItems.map((item, index) => {
          const isSelected = index === selectedIndex;
          const muted = selectedIndex !== null && !isSelected;
          const color = muted ? MUTED_COLOR : PALETTE[index % PALETTE.length];

          const startDeg = (cursor / currentTotal) * 360;
          cursor += item.value;
          const endDeg = (cursor / currentTotal) * 360;
          const midDeg = (startDeg + endDeg) / 2;
          const side = Math.sin((midDeg * Math.PI) / 180) >= 0 ? 1 : -1;

          const segmentGroup = svgEl('g', { class: 'donut-segment' });
          if (isSelected) {
            const dx = Math.sin((midDeg * Math.PI) / 180) * explodeOffset;
            const dy = -Math.cos((midDeg * Math.PI) / 180) * explodeOffset;
            segmentGroup.setAttribute('transform', `translate(${dx},${dy})`);
          }
          segmentGroup.addEventListener('click', () => selectIndex(index));

          const segmentPath = svgEl('path', {
            d: donutSegmentPath(cx, cy, outerR, innerR, startDeg, endDeg),
            fill: color,
          });
          segmentGroup.appendChild(segmentPath);
          svg.appendChild(segmentGroup);

          const p1 = pointOnCircle(cx, cy, outerR + 2, midDeg);
          const p2 = pointOnCircle(cx, cy, lineBendR, midDeg);
          const labelX = p2.x + side * lineOutExtra;

          return {
            item, index, color, side, p1, p2, labelX, isSelected,
            y: p2.y, // may be adjusted by resolveLabelCollisions
          };
        });

        resolveLabelCollisions(labels);

        for (const label of labels) {
          const p3 = { x: label.labelX, y: label.y };
          const labelGroup = svgEl('g', { class: 'donut-segment' });
          labelGroup.addEventListener('click', () => selectIndex(label.index));

          const line = svgEl('polyline', {
            points: `${label.p1.x},${label.p1.y} ${label.p2.x},${label.p2.y} ${p3.x},${p3.y}`,
            fill: 'none',
            stroke: label.color,
            'stroke-width': '1.5',
            'stroke-opacity': label.isSelected ? '1' : '0.85',
          });
          labelGroup.appendChild(line);

          const text = svgEl('text', {
            x: p3.x + label.side * 4,
            y: p3.y,
            'text-anchor': label.side > 0 ? 'start' : 'end',
            'dominant-baseline': 'middle',
            'font-size': Math.max(10, Math.round(minDim * 0.045)),
            'font-weight': label.isSelected ? '700' : '400',
            fill: selectedIndex !== null ? label.color : 'currentColor',
          });
          text.textContent = label.item.name;
          labelGroup.appendChild(text);

          svg.appendChild(labelGroup);
        }

        chartArea.appendChild(svg);
      }

      function render(settings, summary) {
        document.getElementById('title').textContent = settings.title || 'Forbruksfordeling';

        currentItems = (summary.items || []).filter((item) => item.value > 0);
        currentTotal = summary.total || 0;
        if (selectedIndex !== null && selectedIndex >= currentItems.length) selectedIndex = null;

        draw();
      }

      function onHomeyReady(Homey) {
        Homey.ready();

        const settings = Homey.getSettings() || {};
        const deviceIds = Homey.getDeviceIds() || [];
        let lastSummary = null;

        function refresh() {
          Homey.api('GET', `/summary?deviceIds=${encodeURIComponent(deviceIds.join(','))}`)
            .then((summary) => {
              lastSummary = summary;
              render(settings, summary);
            })
            .catch((err) => {
              console.error('Failed to load donut summary:', err);
            });
        }

        refresh();
        setInterval(refresh, REFRESH_INTERVAL_MS);

        // Widgets can be resized on the dashboard after first render -
        // redraw with the new dimensions so the ring/labels stay correct.
        window.addEventListener('resize', () => {
          if (lastSummary) render(settings, lastSummary);
        });
      }
    </script>
  </body>
</html>
