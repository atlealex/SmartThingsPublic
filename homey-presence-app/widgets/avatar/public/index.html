<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .row {
      width: 100%;
      height: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: center;
      gap: 12px;
      box-sizing: border-box;
      padding: 8px;
    }
    .person {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 92px;
    }
    .avatar {
      position: relative;
      width: 76px;
      height: 76px;
      flex: 0 0 auto;
    }
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-sizing: border-box;
      border: 5px solid #8A8A8A;
      transition: border-color 0.3s ease;
    }
    .ring.home {
      border-color: #3ECF5C;
    }
    .photo {
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      overflow: hidden;
      background: #444;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .name {
      font-size: 12px;
      color: var(--homey-text-color, #fff);
      text-align: center;
      max-width: 92px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty {
      font-size: 13px;
      color: var(--homey-text-color, #fff);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="row" id="row">
    <div class="empty" id="empty" style="display:none;">No people found</div>
  </div>

  <script type="text/javascript">
    const POLL_INTERVAL_MS = 10000;

    async function onHomeyReady(Homey) {
      const rowEl = document.getElementById('row');
      const emptyEl = document.getElementById('empty');
      const cardsById = new Map();

      function ensureCard(person) {
        let card = cardsById.get(person.id);
        if (!card) {
          const wrap = document.createElement('div');
          wrap.className = 'person';
          wrap.innerHTML = `
            <div class="avatar">
              <div class="ring"></div>
              <div class="photo"><img alt=""></div>
            </div>
            <div class="name"></div>
          `;
          rowEl.insertBefore(wrap, emptyEl);
          card = {
            wrap,
            ring: wrap.querySelector('.ring'),
            img: wrap.querySelector('img'),
            name: wrap.querySelector('.name'),
            lastPhotoUrl: null,
          };
          cardsById.set(person.id, card);
        }
        return card;
      }

      async function refresh() {
        try {
          const people = await Homey.api('GET', '/people', {});
          emptyEl.style.display = people.length === 0 ? '' : 'none';

          const seenIds = new Set();
          for (const person of people) {
            seenIds.add(person.id);
            const card = ensureCard(person);
            card.name.textContent = person.name || '';
            card.ring.classList.toggle('home', person.home === true);
            if (person.photoUrl && person.photoUrl !== card.lastPhotoUrl) {
              card.img.src = person.photoUrl;
              card.lastPhotoUrl = person.photoUrl;
            }
          }

          for (const [id, card] of cardsById) {
            if (!seenIds.has(id)) {
              card.wrap.remove();
              cardsById.delete(id);
            }
          }
        } catch (err) {
          emptyEl.textContent = 'Error loading people';
          emptyEl.style.display = '';
        }
      }

      await refresh();
      setInterval(refresh, POLL_INTERVAL_MS);

      await Homey.ready();
    }
  </script>
</body>
</html>
