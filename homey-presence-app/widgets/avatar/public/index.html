<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .avatar {
      position: relative;
      width: 92px;
      height: 92px;
      flex: 0 0 auto;
    }
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-sizing: border-box;
      border: 6px solid #8A8A8A;
      transition: border-color 0.3s ease;
    }
    .ring.home {
      border-color: #3ECF5C;
    }
    .photo {
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      overflow: hidden;
      background: #444;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .name {
      font-size: 12px;
      color: var(--homey-text-color, #fff);
      text-align: center;
      max-width: 110px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="avatar">
      <div class="ring" id="ring"></div>
      <div class="photo"><img id="photo" alt=""></div>
    </div>
    <div class="name" id="name"></div>
  </div>

  <script type="text/javascript">
    const POLL_INTERVAL_MS = 10000;

    function extractDeviceId(settings) {
      const device = settings && settings.device;
      if (!device) return null;
      return typeof device === 'string' ? device : (device.id || null);
    }

    async function onHomeyReady(Homey) {
      const deviceId = extractDeviceId(Homey.getSettings());

      const photoEl = document.getElementById('photo');
      const ringEl = document.getElementById('ring');
      const nameEl = document.getElementById('name');

      let lastPhotoUrl = null;

      async function refresh() {
        if (!deviceId) {
          nameEl.textContent = 'No device selected';
          return;
        }
        try {
          const status = await Homey.api('GET', `/status?deviceId=${encodeURIComponent(deviceId)}`, {});
          nameEl.textContent = status.name || '';
          ringEl.classList.toggle('home', status.home === true);
          if (status.photoUrl && status.photoUrl !== lastPhotoUrl) {
            photoEl.src = status.photoUrl;
            lastPhotoUrl = status.photoUrl;
          }
        } catch (err) {
          nameEl.textContent = 'Error';
        }
      }

      await refresh();
      setInterval(refresh, POLL_INTERVAL_MS);

      await Homey.ready({ height: 140 });
    }
  </script>
</body>
</html>
