<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .row {
      width: 100%;
      height: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: center;
      gap: 12px;
      box-sizing: border-box;
      padding: 8px;
    }
    .person {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 92px;
    }
    .person.hidden {
      display: none;
    }
    .avatar {
      position: relative;
      width: 76px;
      height: 76px;
      flex: 0 0 auto;
    }
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-sizing: border-box;
      border: 5px solid #8A8A8A;
      transition: border-color 0.3s ease;
    }
    .ring.home {
      border-color: #3ECF5C;
    }
    .ring.zone {
      border-color: #F5C542;
    }
    .photo {
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      overflow: hidden;
      background: #444;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .name {
      font-size: 12px;
      color: var(--homey-text-color, #fff);
      text-align: center;
      max-width: 92px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .zone-label {
      font-size: 10px;
      color: #F5C542;
      text-align: center;
      max-width: 92px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty {
      font-size: 13px;
      color: var(--homey-text-color, #fff);
      opacity: 0.7;
    }
    .debug {
      font-size: 9px;
      color: #f66;
      max-width: 92px;
      word-break: break-all;
      text-align: center;
      min-height: 10px;
    }
  </style>
</head>
<body>
  <div class="row" id="row">
    <!-- Fixed pool of slots, present from page load (not injected later) -->
    <div class="person hidden" data-slot="0"><div class="avatar"><div class="ring"></div><div class="photo"><img alt=""></div></div><div class="name"></div><div class="zone-label"></div><div class="debug"></div></div>
    <div class="person hidden" data-slot="1"><div class="avatar"><div class="ring"></div><div class="photo"><img alt=""></div></div><div class="name"></div><div class="zone-label"></div><div class="debug"></div></div>
    <div class="person hidden" data-slot="2"><div class="avatar"><div class="ring"></div><div class="photo"><img alt=""></div></div><div class="name"></div><div class="zone-label"></div><div class="debug"></div></div>
    <div class="person hidden" data-slot="3"><div class="avatar"><div class="ring"></div><div class="photo"><img alt=""></div></div><div class="name"></div><div class="zone-label"></div><div class="debug"></div></div>
    <div class="person hidden" data-slot="4"><div class="avatar"><div class="ring"></div><div class="photo"><img alt=""></div></div><div class="name"></div><div class="zone-label"></div><div class="debug"></div></div>
    <div class="person hidden" data-slot="5"><div class="avatar"><div class="ring"></div><div class="photo"><img alt=""></div></div><div class="name"></div><div class="zone-label"></div><div class="debug"></div></div>
    <div class="person hidden" data-slot="6"><div class="avatar"><div class="ring"></div><div class="photo"><img alt=""></div></div><div class="name"></div><div class="zone-label"></div><div class="debug"></div></div>
    <div class="person hidden" data-slot="7"><div class="avatar"><div class="ring"></div><div class="photo"><img alt=""></div></div><div class="name"></div><div class="zone-label"></div><div class="debug"></div></div>
    <div class="empty" id="empty" style="display:none;">Nobody home</div>
  </div>

  <script type="text/javascript">
    const POLL_INTERVAL_MS = 10000;
    const MAX_SLOTS = 8;

    async function onHomeyReady(Homey) {
      const emptyEl = document.getElementById('empty');
      const slots = [];
      for (let i = 0; i < MAX_SLOTS; i++) {
        const wrap = document.querySelector(`.person[data-slot="${i}"]`);
        const img = wrap.querySelector('img');
        const debugEl = wrap.querySelector('.debug');
        img.addEventListener('error', () => { debugEl.textContent = 'FAILED: ' + (img.src || '(empty)'); });
        img.addEventListener('load', () => { debugEl.textContent = ''; });
        slots.push({
          wrap,
          ring: wrap.querySelector('.ring'),
          img,
          name: wrap.querySelector('.name'),
          zoneLabel: wrap.querySelector('.zone-label'),
          lastPhotoUrl: null,
        });
      }

      async function refresh() {
        try {
          const people = await Homey.api('GET', '/people', {});
          emptyEl.style.display = people.length === 0 ? '' : 'none';

          for (let i = 0; i < MAX_SLOTS; i++) {
            const slot = slots[i];
            const person = people[i];
            if (!person) {
              slot.wrap.classList.add('hidden');
              continue;
            }
            slot.wrap.classList.remove('hidden');
            slot.name.textContent = person.name || '';
            slot.zoneLabel.textContent = person.zone || '';
            slot.ring.classList.toggle('zone', Boolean(person.zone));
            slot.ring.classList.toggle('home', person.home === true && !person.zone);
            if (person.photoUrl && person.photoUrl !== slot.lastPhotoUrl) {
              slot.img.src = person.photoUrl;
              slot.lastPhotoUrl = person.photoUrl;
            }
          }
        } catch (err) {
          emptyEl.textContent = 'Error loading people';
          emptyEl.style.display = '';
        }
      }

      await refresh();
      setInterval(refresh, POLL_INTERVAL_MS);

      await Homey.ready();
    }
  </script>
</body>
</html>
